name: Build PortForwarder EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'PortForwarder/**'
      - '.github/workflows/build-portforwarder-exe.yml'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE
        run: dotnet publish PortForwarder/PortForwarder.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortForwarder-win-x64
          path: out/PortForwarder.exe
